# 主页内容 · 改这里就能改首页，不用碰模板
#
# 这个文件驱动 layouts/list.html 渲染的首页（仅首页，不影响文章页/列表页/搜索/评论）。
# 想换文字、加项目、改联系方式，只改本文件即可。

profile:
  # 站名（首屏大标题）
  name: "d20260825613-hub 的个人博客"
  # 副标题：一句话说明这是谁、做什么
  role: "独立工具开发者"
  # 个人简介：大白话，普通博客的写法
  bio: >-
    平时写写代码，记录一些学习和折腾过程里的笔记，想到什么就更新什么。
  # 头像：GitHub 头像已用 scripts/fetch-avatar.js 下载到本地，
  # 本地加载、不引外链（外链在国内经常超时变成破图）。
  # 想换头像：重跑 `node scripts/fetch-avatar.js <用户名> 512`
  avatar: "/img/avatar.png"
  avatarFallback: "/images/avatar-placeholder.svg"
  # 头像上的首字（仅占位图使用）
  initials: "d"

# 联系方式：显示在首屏，邮箱可点击直接发信
contact:
  email: "contact@example.com"
  location: "China · UTC+8"
  status: "持续维护中"
  # 这些会渲染成首屏下方的一排标签（chip）
  chips:
    - label: "邮箱"
      value: "contact@example.com"
      href: "mailto:contact@example.com"
      icon: "mail"
    - label: "所在地"
      value: "China · UTC+8"
      icon: "pin"
    - label: "状态"
      value: "持续维护中"
      icon: "pulse"

# 社交入口（按钮）
links:
  - label: "GitHub"
    href: "https://github.com/d20260825613-hub"
    icon: "github"
  - label: "博客"
    href: "/posts/"
    icon: "book"
  - label: "RSS"
    href: "/index.xml"
    icon: "rss"
  - label: "写邮件"
    href: "mailto:contact@example.com"
    icon: "mail"

# 项目卡片。status 建议只用三种，样式表按 status-<值> 着色：
#   active   绿色  持续维护
#   stable   蓝色  可用，只在必要时改
#   planned  灰色  计划中
projects:
  - name: "netpeek"
    tagline: "扫出局域网里到底有什么：活着的主机、开放的 TCP 端口、每个 MAC 背后的厂商。"
    status: "active"
    statusLabel: "维护中"
    icon: "radar"
    repo: "https://github.com/d20260825613-hub/netpeek"
    meta: "91 测试 · 零依赖"
    tags: ["网络诊断", "端口扫描", "ARP"]
  - name: "dropjar"
    tagline: "把文件夹变成局域网网页，手机扫码即可双向传文件。不用账号、不用云、不用数据线。"
    status: "active"
    statusLabel: "维护中"
    icon: "transfer"
    repo: "https://github.com/d20260825613-hub/dropjar"
    meta: "84 测试 · 自写二维码"
    tags: ["文件传输", "局域网", "HTTP"]
  - name: "tabkit"
    tagline: "看一眼表格的列、在 CSV/JSON/Markdown 之间互转、用表达式筛行，全程不碰 eval。"
    status: "active"
    statusLabel: "维护中"
    icon: "table"
    repo: "https://github.com/d20260825613-hub/tabkit"
    meta: "148 测试 · 零依赖"
    tags: ["数据处理", "CSV", "自动化"]
  - name: "spacehog"
    tagline: "审计目录树里到底是什么在占地方：重复文件、大文件、垃圾文件、稀疏文件、空目录。"
    status: "stable"
    statusLabel: "稳定"
    icon: "disk"
    repo: "https://github.com/d20260825613-hub/spacehog"
    meta: "130 测试 · 含 Windows 二进制"
    tags: ["磁盘整理", "重复文件", "审计"]

# 背景图（首屏底图）。换图就替换 static/images/ 下这两个文件
background:
  image: "/images/hero-bg.jpg"
  imageMobile: "/images/hero-bg-mobile.jpg"
  # 遮罩强度：越大文字越清楚、图片越淡。0.55 ~ 0.8 之间比较合适
  overlay: 0.68

# 首页底部：最新文章条数（0 表示不显示这一段）
recentPosts: 3
recentPostsTitle: "最新文章"
