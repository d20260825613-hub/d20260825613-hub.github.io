  </defs>

  <circle cx="128" cy="128" r="128" fill="url(#avBg)"/>
  <circle cx="128" cy="128" r="128" fill="url(#avGlow)"/>

  <!-- 占位图形：一叠"层"，呼应工具箱里都是分层的小工具 -->
